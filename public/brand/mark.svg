<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Oil drop falling onto sand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="dropBody" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="0.35" stop-color="#23262c"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </radialGradient>
    <linearGradient id="dropRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c37a" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#e6c37a" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6c37a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sandTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eacb86"/>
      <stop offset="0.55" stop-color="#d4ab63"/>
      <stop offset="1" stop-color="#a9803d"/>
    </linearGradient>
    <linearGradient id="sandShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="wetSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#15161a" stop-opacity="0.95"/>
      <stop offset="0.7" stop-color="#2a2417" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5a4a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="17" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(23)">
      <circle cx="3" cy="4" r="1.1" fill="#7a5c26" fill-opacity="0.35"/>
      <circle cx="10" cy="9" r="0.9" fill="#fff2c9" fill-opacity="0.45"/>
      <circle cx="7" cy="12" r="0.8" fill="#8c6a2e" fill-opacity="0.3"/>
      <circle cx="12" cy="2" r="0.7" fill="#fff2c9" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="sandClip">
      <path d="M40 392 C120 330 200 322 256 330 C320 340 400 338 472 392 L472 470 C472 486 458 496 440 496 L72 496 C54 496 40 486 40 470 Z"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sand mound -->
  <g clip-path="url(#sandClip)">
    <rect x="0" y="300" width="512" height="220" fill="url(#sandTop)"/>
    <rect x="0" y="300" width="512" height="220" fill="url(#grain)"/>
    <rect x="0" y="300" width="512" height="220" fill="url(#sandShade)"/>
    <!-- ripples in the sand -->
    <path d="M60 445 C160 425 350 425 452 445" fill="none" stroke="#8a6a30" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <path d="M90 468 C180 452 330 452 422 468" fill="none" stroke="#8a6a30" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
    <!-- wet impact spot with a rising crown -->
    <ellipse cx="256" cy="374" rx="62" ry="18" fill="url(#wetSpot)"/>
    <ellipse cx="256" cy="368" rx="34" ry="9" fill="none" stroke="#101115" stroke-opacity="0.95" stroke-width="5"/>
    <ellipse cx="256" cy="369" rx="18" ry="5" fill="#101115" fill-opacity="0.9"/>
    <path d="M222 366 C218 356 222 346 228 344 C232 350 230 360 226 366 Z" fill="#111216"/>
    <path d="M290 366 C294 356 290 346 284 344 C280 350 282 360 286 366 Z" fill="#111216"/>
    <path d="M256 364 C252 352 254 340 258 334 C262 340 262 352 258 364 Z" fill="#111216"/>
    <circle cx="228" cy="334" r="3.4" fill="#111216"/>
    <circle cx="286" cy="332" r="3" fill="#111216"/>
    <circle cx="259" cy="322" r="2.6" fill="#111216"/>
  </g>
  <!-- sand edge highlight -->
  <path d="M40 392 C120 330 200 322 256 330 C320 340 400 338 472 392" fill="none" stroke="#fff3cf" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- ground shadow of the drop -->
  <ellipse cx="256" cy="380" rx="26" ry="6" fill="#000" fill-opacity="0.25" filter="url(#soft)"/>

  <!-- motion trail -->
  <path d="M256 18 L256 50" stroke="#3a3f47" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <path d="M228 40 L234 70" stroke="#3a3f47" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  <path d="M284 40 L278 70" stroke="#3a3f47" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>

  <!-- oil drop -->
  <path d="M256 64 C256 64 176 172 176 218 C176 264 212 294 256 294 C300 294 336 264 336 218 C336 172 256 64 256 64 Z" fill="url(#dropBody)"/>
  <path d="M256 64 C256 64 176 172 176 218 C176 264 212 294 256 294 C300 294 336 264 336 218 C336 172 256 64 256 64 Z" fill="url(#dropRim)"/>
  <!-- specular highlights -->
  <ellipse cx="226" cy="194" rx="14" ry="30" transform="rotate(-18 226 194)" fill="#ffffff" fill-opacity="0.72"/>
  <ellipse cx="238" cy="254" rx="8" ry="5" fill="#ffffff" fill-opacity="0.28"/>
  <!-- sand reflection on the lower right of the drop -->
  <path d="M300 258 C312 248 320 236 324 224 C326 242 318 264 300 276 Z" fill="#e6c37a" fill-opacity="0.35"/>
</svg>
